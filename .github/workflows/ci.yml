name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up npm
        run: npm install --global npm@11.13.0

      - name: Set up Python build tooling
        run: python -m pip install setuptools==83.0.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate and lint
        run: npm run generate && npm run lint

      - name: Build
        run: npm run build

      - name: Cache llamafile
        uses: actions/cache@v4
        with:
          path: .llamafile
          key: ${{ runner.os }}-${{ runner.arch }}-llamafile-${{ hashFiles('tooling/ensure-llamafile.ts') }}

      - name: Download and verify llamafile
        run: npm run ensure-llamafile

      - name: Run end-to-end tests
        run: npm run test:e2e
